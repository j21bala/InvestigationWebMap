<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de relacionados – Gustavo Petro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col">
<header class="p-3 border-b border-slate-800 flex flex-wrap gap-3 items-center">
  <h1 class="text-lg font-bold">Mapa de relacionados: Gustavo Petro (PEP)</h1>
  <input id="q" list="names" placeholder="Buscar persona…" class="bg-slate-800 rounded px-3 py-1 text-sm w-56 outline-none focus:ring-2 ring-cyan-500">
  <datalist id="names"></datalist>
  <button id="reset" class="bg-slate-800 hover:bg-slate-700 rounded px-3 py-1 text-sm">Centrar</button>
  <div id="chips" class="flex flex-wrap gap-2"></div>
  <p class="text-xs text-slate-400 w-full">Arrastre fondo y nodos, rueda para zoom, clic para ver la ficha. B = cliente banco · F = cliente fiduciaria. Un vínculo no implica responsabilidad ni condena.</p>
</header>
<main class="flex flex-col md:flex-row flex-1 min-h-0">
  <svg id="g" class="flex-1 min-h-0 touch-none select-none"></svg>
  <aside id="side" class="md:w-96 max-h-[45vh] md:max-h-none overflow-y-auto p-4 border-t md:border-t-0 md:border-l border-slate-800 bg-slate-900">
    <p class="text-sm text-slate-400">Seleccione un nodo para ver su ficha.</p></aside>
</main>
<script src="data.js"></script><script src="core.js"></script>
<script>
const nodes=JSON.parse(JSON.stringify(window.DATA));layout(nodes);
let sel=null;const side=document.getElementById("side");
const map=createMap(document.getElementById("g"),{nodes:()=>nodes,sel:()=>sel,
  onSelect:id=>{sel=id;map.draw();side.innerHTML=id?cardHTML(byId(nodes,id),nodes):'<p class="text-sm text-slate-400">Seleccione un nodo.</p>'}});
legend(document.getElementById("chips"),map);
document.getElementById("names").innerHTML=nodes.map(n=>`<option value="${esc(n.name)}">`).join("");
document.getElementById("q").onchange=e=>{const n=nodes.find(n=>n.name.toLowerCase()==e.target.value.toLowerCase())||nodes.find(n=>n.name.toLowerCase().includes(e.target.value.toLowerCase()));if(n){map.center(n.id);sel=n.id;map.draw();side.innerHTML=cardHTML(n,nodes)}};
document.getElementById("reset").onclick=()=>map.center();
map.center();
</script></body></html>
