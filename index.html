<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de relacionados – Gustavo Petro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col">

<div id="login" class="hidden fixed inset-0 z-50 bg-black/80 grid place-items-center">
  <div class="bg-slate-900 p-6 rounded-xl w-80 space-y-3">
    <h2 class="font-bold">Acceso administrador</h2>
    <input id="pw" type="password" placeholder="Token de GitHub" class="w-full bg-slate-800 rounded px-3 py-2 outline-none focus:ring-2 ring-cyan-500">
    <div class="flex gap-2">
      <button id="go" class="flex-1 bg-cyan-600 hover:bg-cyan-500 rounded py-2 font-semibold">Entrar</button>
      <button id="cancel" class="bg-slate-700 hover:bg-slate-600 rounded px-3">Cancelar</button>
    </div>
    <p id="err" class="text-red-400 text-sm"></p>
  </div>
</div>

<header class="p-3 border-b border-slate-800 flex flex-wrap gap-3 items-center">
  <h1 class="text-lg font-bold">Mapa de relacionados: Gustavo Petro (PEP)</h1>
  <input id="q" list="names" placeholder="Buscar persona…" class="bg-slate-800 rounded px-3 py-1 text-sm w-56 outline-none focus:ring-2 ring-cyan-500">
  <datalist id="names"></datalist>
  <button id="reset" class="bg-slate-800 hover:bg-slate-700 rounded px-3 py-1 text-sm">Centrar</button>
  <div id="tools" class="hidden flex flex-wrap gap-2">
    <button id="add" class="bg-cyan-600 hover:bg-cyan-500 rounded px-3 py-1 text-sm">+ Agregar persona</button>
    <button id="dl" class="bg-emerald-600 hover:bg-emerald-500 rounded px-3 py-1 text-sm">Descargar data.js</button>
    <button id="rst" class="bg-slate-700 hover:bg-slate-600 rounded px-3 py-1 text-sm">Recargar</button>
  </div>
  <button id="adm" class="ml-auto bg-amber-600 hover:bg-amber-500 rounded px-3 py-1 text-sm font-semibold">Admin</button>
  <div id="chips" class="flex flex-wrap gap-2 w-full"></div>
  <p class="text-xs text-slate-400 w-full">Arrastre fondo y nodos, rueda para zoom, clic para ver la ficha. B = cliente banco · F = cliente fiduciaria. Un vínculo no implica responsabilidad ni condena.</p>
</header>

<main class="flex flex-col md:flex-row flex-1 min-h-0">
  <svg id="g" class="flex-1 min-h-0 touch-none select-none"></svg>
  <aside id="side" class="md:w-[26rem] max-h-[50vh] md:max-h-none overflow-y-auto p-4 border-t md:border-t-0 md:border-l border-slate-800 bg-slate-900 text-sm"></aside>
</main>

<script src="data.js"></script><script src="core.js"></script>
<script>
const REPO="j21bala/InvestigationWebMap",BRANCH="main",FILE="data.js";
const API=`https://api.github.com/repos/${REPO}/contents/${FILE}`;
const $=id=>document.getElementById(id);
const fresh=()=>JSON.parse(JSON.stringify(window.DATA));
let admin=false,sel=null,token="",sha=null,busy=false,again=false,st;
let nodes=fresh();
layout(nodes);

function toast(m){let t=$("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="fixed bottom-4 right-4 bg-slate-800 border border-slate-600 text-sm rounded px-3 py-2 z-50";document.body.appendChild(t)}
  t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2500)}

const gh=(u,o={})=>fetch(u,{cache:"no-store",...o,headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json",...(o.headers||{})}});
const b64=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=8192)r+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(r)};
async function getSha(){const r=await gh(API+"?ref="+BRANCH);if(!r.ok)throw r.status;sha=(await r.json()).sha}
async function loadLatest(){
  const r=await gh(API+"?ref="+BRANCH,{headers:{Accept:"application/vnd.github.raw+json"}});
  if(!r.ok)throw r.status;
  const t=await r.text();
  nodes=JSON.parse(t.replace(/^\s*window\.DATA\s*=\s*/,"").replace(/;\s*$/,""));
  layout(nodes);
}
const put=()=>gh(API,{method:"PUT",body:JSON.stringify({
  message:"Actualiza data.js desde admin",
  content:b64("window.DATA="+JSON.stringify(nodes,null,1)+";"),sha,branch:BRANCH})});
async function push(){
  if(busy){again=true;return}
  busy=true;
  try{
    if(!sha)await getSha();
    let r=await put();
    if(r.status===409||r.status===422){await getSha();r=await put()}
    if(!r.ok)throw r.status;
    sha=(await r.json()).content.sha;
    toast("Guardado ✓ (visible para todos en ~1 min)");
  }catch(e){toast("⚠ Error al guardar ("+e+")")}
  busy=false;if(again){again=false;push()}
}
const save=()=>{clearTimeout(st);st=setTimeout(push,600)};

const side=$("side");
const empty='<p class="text-slate-400">Seleccione un nodo para ver su ficha.</p>';
const inp="w-full bg-slate-800 rounded px-2 py-1 outline-none focus:ring-2 ring-cyan-500";

const map=createMap($("g"),{nodes:()=>nodes,sel:()=>sel,onMove:()=>{if(admin)save()},
  onSelect:id=>{sel=id;map.draw();render()}});
legend($("chips"),map);
const names=()=>{$("names").innerHTML=nodes.map(n=>`<option value="${esc(n.name)}">`).join("")};
names();map.center();render();

$("q").onchange=e=>{const v=e.target.value.toLowerCase(),n=nodes.find(n=>n.name.toLowerCase()==v)||nodes.find(n=>n.name.toLowerCase().includes(v));
  if(n){sel=n.id;map.center(n.id);render()}};
$("reset").onclick=()=>map.center();

/* ---- Login ---- */
$("adm").onclick=()=>{
  if(admin){admin=false;token="";sha=null;$("tools").classList.add("hidden");$("adm").textContent="Admin";render();return}
  $("login").classList.remove("hidden");$("pw").value="";$("err").textContent="";$("pw").focus()};
$("cancel").onclick=()=>$("login").classList.add("hidden");
$("go").onclick=async()=>{
  token=$("pw").value.trim();$("err").textContent="Verificando…";
  try{
    await loadLatest();await getSha();
    admin=true;sel=null;
    $("login").classList.add("hidden");$("tools").classList.remove("hidden");$("adm").textContent="Salir de admin";
    names();map.draw();map.center();render();
  }catch(e){token="";$("err").textContent="Token inválido o sin permisos ("+e+")"}};
$("pw").onkeydown=e=>{if(e.key=="Enter")$("go").click()};

/* ---- Herramientas admin ---- */
$("add").onclick=()=>{const p=byId(nodes,sel)||byId(nodes,"c"),a=Math.random()*6.28;
  const n={id:"n"+Date.now(),name:"Nueva persona",rel:"ext",parent:p.id,risk:"na",photo:"",doc:"",desc:"",evid:"",flags:"",src:"",
    upd:new Date().toISOString().slice(0,10),bank:{cliente:false,productos:[]},fid:{cliente:false,productos:[]},
    x:p.x+180*Math.cos(a),y:p.y+180*Math.sin(a)};
  nodes.push(n);sel=n.id;save();names();map.draw();render()};
$("dl").onclick=()=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["window.DATA="+JSON.stringify(nodes,null,1)+";"],{type:"text/javascript"}));a.download="data.js";a.click()};
$("rst").onclick=async()=>{if(!confirm("¿Recargar desde el último guardado en GitHub?"))return;
  try{await loadLatest();await getSha();sel=null;names();map.draw();map.center();render();toast("Recargado ✓")}catch(e){toast("⚠ Error ("+e+")")}};

/* ---- Panel ---- */
const L=t=>`<label class="block text-xs text-slate-400 mt-3 mb-1">${t}</label>`;
const T=(f,v)=>`<input data-f="${f}" value="${esc(v)}" class="${inp}">`;
const A=(f,v)=>`<textarea data-f="${f}" rows="3" class="${inp}">${esc(v)}</textarea>`;
function prodBlock(k,t,b){
  b=b||{cliente:false,productos:[]};
  return `<div class="border border-slate-700 rounded-lg p-3 mt-3"><b>${t}</b>
  <select data-f="${k}.cliente" class="${inp} mt-2"><option value="false"${b.cliente?"":" selected"}>No es cliente</option><option value="true"${b.cliente?" selected":""}>Sí es cliente</option></select>
  <div class="mt-2 space-y-2">${(b.productos||[]).map((p,i)=>`<div class="flex gap-1"><input data-p="${k}:${i}:tipo" value="${esc(p.tipo)}" placeholder="Producto (cuenta, CDT…)" class="${inp}"><input data-p="${k}:${i}:numero" value="${esc(p.numero)}" placeholder="N.º" class="${inp} font-mono"><button data-rm="${k}:${i}" class="bg-red-600 hover:bg-red-500 rounded px-2">✕</button></div>`).join("")}</div>
  <button data-ap="${k}" class="mt-2 bg-slate-700 hover:bg-slate-600 rounded px-2 py-1 text-xs">+ Agregar producto</button></div>`;
}
function render(){
  const n=byId(nodes,sel);
  if(!n){side.innerHTML=empty;return}
  if(!admin){side.innerHTML=cardHTML(n,nodes);return}
  const rl=Object.keys(REL).map(k=>`<option value="${k}"${k==n.rel?" selected":""}>${REL[k][0]}</option>`).join("");
  const rk=Object.keys(RISK).map(k=>`<option value="${k}"${k==n.risk?" selected":""}>${RISK[k][0]}</option>`).join("");
  const par=nodes.filter(m=>m.id!==n.id).map(m=>`<option value="${m.id}"${m.id==n.parent?" selected":""}>${esc(m.name)}</option>`).join("");
  side.innerHTML=`<div class="text-xs text-amber-400 font-semibold mb-2">MODO EDICIÓN · guardado automático</div>
  <div class="flex items-center gap-3">${n.photo?`<img src="${esc(n.photo)}" class="w-16 h-16 rounded-full object-cover">`:`<div class="w-16 h-16 rounded-full grid place-items-center bg-slate-700 text-xl font-bold">${ini(n.name)}</div>`}<h2 class="font-bold text-lg">${esc(n.name)}</h2></div>
  ${L("Foto (URL o ruta, ej. fotos/nombre.jpg)")}${T("photo",n.photo)}${L("Nombre")}${T("name",n.name)}${L("Documento (CC / NIT)")}${T("doc",n.doc)}
  ${L("Tipo de relación")}<select data-f="rel" class="${inp}">${rl}</select>
  ${n.id==="c"?"":`${L("Vinculado a")}<select data-f="parent" class="${inp}">${par}</select>`}
  ${L("Riesgo")}<select data-f="risk" class="${inp}">${rk}</select>
  ${L("Descripción breve")}${A("desc",n.desc)}
  ${prodBlock("bank","Banco",n.bank)}${prodBlock("fid","Fiduciaria",n.fid)}
  ${L("Evidencia")}${A("evid",n.evid)}${L("Señales de alerta")}${A("flags",n.flags)}
  ${L("Fuente")}${T("src",n.src)}${L("Fecha de actualización")}<input type="date" data-f="upd" value="${esc(n.upd)}" class="${inp}">
  ${n.id!=="c"?`<button id="del" class="mt-4 w-full bg-red-600 hover:bg-red-500 rounded py-2">Eliminar persona</button>`:""}`;
}
side.addEventListener("change",e=>{
  if(!admin)return;const n=byId(nodes,sel);if(!n)return;const t=e.target;
  if(t.dataset.f){const[a,b]=t.dataset.f.split(".");
    if(b){n[a]=n[a]||{cliente:false,productos:[]};n[a][b]=t.value==="true"}else n[a]=t.value;
    n.upd=new Date().toISOString().slice(0,10);
    save();names();map.draw();render()}
  if(t.dataset.p){const[k,i,f]=t.dataset.p.split(":");n[k].productos[+i][f]=t.value;save()}
});
side.addEventListener("click",e=>{
  if(!admin)return;const n=byId(nodes,sel),t=e.target;if(!n)return;
  if(t.dataset.ap){n[t.dataset.ap]=n[t.dataset.ap]||{cliente:true,productos:[]};n[t.dataset.ap].productos.push({tipo:"",numero:""});save();render()}
  if(t.dataset.rm){const[k,i]=t.dataset.rm.split(":");n[k].productos.splice(+i,1);save();render()}
  if(t.id==="del"&&confirm("¿Eliminar a "+n.name+" y sus dependientes?")){
    const rm=new Set([n.id]);let ch=true;while(ch){ch=false;nodes.forEach(m=>{if(!rm.has(m.id)&&rm.has(m.parent)){rm.add(m.id);ch=true}})}
    nodes=nodes.filter(m=>!rm.has(m.id));sel=null;save();names();map.draw();render()}
});
</script></body></html>
