<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col">

<div id="login" class="fixed inset-0 z-50 bg-slate-950 grid place-items-center">
  <div class="bg-slate-900 p-6 rounded-xl w-80 space-y-3">
    <h1 class="font-bold">Acceso administrador</h1>
    <input id="pw" type="password" placeholder="Contraseña" class="w-full bg-slate-800 rounded px-3 py-2 outline-none focus:ring-2 ring-cyan-500">
    <button id="go" class="w-full bg-cyan-600 hover:bg-cyan-500 rounded py-2 font-semibold">Entrar</button>
    <p id="err" class="text-red-400 text-sm"></p>
  </div>
</div>

<header class="p-3 border-b border-slate-800 flex flex-wrap gap-2 items-center">
  <h1 class="font-bold mr-2">Admin · Relacionados</h1>
  <button id="add" class="bg-cyan-600 hover:bg-cyan-500 rounded px-3 py-1 text-sm">+ Agregar persona</button>
  <button id="dl" class="bg-emerald-600 hover:bg-emerald-500 rounded px-3 py-1 text-sm">Descargar data.js</button>
  <button id="rst" class="bg-slate-700 hover:bg-slate-600 rounded px-3 py-1 text-sm">Restablecer</button>
  <button id="ctr" class="bg-slate-700 hover:bg-slate-600 rounded px-3 py-1 text-sm">Centrar</button>
  <span class="text-xs text-slate-400">Los cambios se guardan en este navegador. Para publicar: descargue data.js y reemplácelo en GitHub.</span>
</header>
<main class="flex flex-col md:flex-row flex-1 min-h-0">
  <svg id="g" class="flex-1 min-h-0 touch-none select-none"></svg>
  <aside id="side" class="md:w-[26rem] max-h-[55vh] md:max-h-none overflow-y-auto p-4 border-t md:border-t-0 md:border-l border-slate-800 bg-slate-900 text-sm"></aside>
</main>

<script src="data.js"></script><script src="core.js"></script>
<script>
/* Para definir contraseña: deje ADMIN_HASH vacío, escriba la contraseña y copie el hash que aparece. Péguelo aquí. */
const ADMIN_HASH="";
const KEY="petro-admin-v1";
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const $=id=>document.getElementById(id);
$("go").onclick=async()=>{const h=await sha($("pw").value);
  if(!ADMIN_HASH){prompt("Copie este hash en ADMIN_HASH:",h);return}
  if(h===ADMIN_HASH){$("login").remove();start()}else $("err").textContent="Contraseña incorrecta"};
$("pw").onkeydown=e=>{if(e.key=="Enter")$("go").click()};

let nodes,sel=null,map;
const side=$("side");
const inp="w-full bg-slate-800 rounded px-2 py-1 outline-none focus:ring-2 ring-cyan-500";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(nodes))}catch(e){}};
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return JSON.parse(JSON.stringify(window.DATA))}

function start(){
  nodes=load();layout(nodes);
  map=createMap($("g"),{nodes:()=>nodes,sel:()=>sel,onMove:save,onSelect:id=>{sel=id;map.draw();panel()}});
  map.center();panel();
  $("add").onclick=()=>{const p=byId(nodes,sel)||byId(nodes,"c"),a=Math.random()*6.28;
    const n={id:"n"+Date.now(),name:"Nueva persona",rel:"ext",parent:p.id,risk:"na",photo:"",doc:"",desc:"",evid:"",flags:"",src:"",upd:new Date().toISOString().slice(0,10),
      bank:{cliente:false,productos:[]},fid:{cliente:false,productos:[]},x:p.x+180*Math.cos(a),y:p.y+180*Math.sin(a)};
    nodes.push(n);sel=n.id;save();map.draw();panel()};
  $("dl").onclick=()=>{const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["window.DATA="+JSON.stringify(nodes,null,1)+";"],{type:"text/javascript"}));a.download="data.js";a.click()};
  $("rst").onclick=()=>{if(confirm("¿Descartar cambios locales y volver a data.js?")){localStorage.removeItem(KEY);nodes=JSON.parse(JSON.stringify(window.DATA));layout(nodes);sel=null;map.draw();panel()}};
  $("ctr").onclick=()=>map.center();
}

const L=t=>`<label class="block text-xs text-slate-400 mt-3 mb-1">${t}</label>`;
const T=(f,v)=>`<input data-f="${f}" value="${esc(v)}" class="${inp}">`;
const A=(f,v)=>`<textarea data-f="${f}" rows="3" class="${inp}">${esc(v)}</textarea>`;
const S=(f,list,v)=>`<select data-f="${f}" class="${inp}">${list}</select>`.replace(`value="${v}"`,`value="${v}" selected`);
function prodBlock(k,t,b){
  b=b||{cliente:false,productos:[]};
  return `<div class="border border-slate-700 rounded-lg p-3 mt-3"><b>${t}</b>
  <select data-f="${k}.cliente" class="${inp} mt-2"><option value="false"${b.cliente?"":" selected"}>No es cliente</option><option value="true"${b.cliente?" selected":""}>Sí es cliente</option></select>
  <div class="mt-2 space-y-2">${(b.productos||[]).map((p,i)=>`<div class="flex gap-1"><input data-p="${k}:${i}:tipo" value="${esc(p.tipo)}" placeholder="Producto (cuenta, CDT…)" class="${inp}"><input data-p="${k}:${i}:numero" value="${esc(p.numero)}" placeholder="N.º" class="${inp} font-mono"><button data-rm="${k}:${i}" class="bg-red-600 hover:bg-red-500 rounded px-2">✕</button></div>`).join("")}</div>
  <button data-ap="${k}" class="mt-2 bg-slate-700 hover:bg-slate-600 rounded px-2 py-1 text-xs">+ Agregar producto</button></div>`;
}
function panel(){
  const n=byId(nodes,sel);
  if(!n){side.innerHTML='<p class="text-slate-400">Seleccione un nodo para editar su ficha.</p>';return}
  const rl=Object.keys(REL).map(k=>`<option value="${k}"${k==n.rel?" selected":""}>${REL[k][0]}</option>`).join("");
  const rk=Object.keys(RISK).map(k=>`<option value="${k}"${k==n.risk?" selected":""}>${RISK[k][0]}</option>`).join("");
  const par=nodes.filter(m=>m.id!==n.id).map(m=>`<option value="${m.id}"${m.id==n.parent?" selected":""}>${esc(m.name)}</option>`).join("");
  side.innerHTML=`<div class="flex items-center gap-3">${n.photo?`<img src="${esc(n.photo)}" class="w-16 h-16 rounded-full object-cover">`:`<div class="w-16 h-16 rounded-full grid place-items-center bg-slate-700 text-xl font-bold">${ini(n.name)}</div>`}<h2 class="font-bold text-lg">${esc(n.name)}</h2></div>
  ${L("Foto (URL)")}${T("photo",n.photo)}${L("Nombre")}${T("name",n.name)}${L("Documento (CC / NIT)")}${T("doc",n.doc)}
  ${L("Tipo de relación")}<select data-f="rel" class="${inp}">${rl}</select>
  ${L("Vinculado a")}<select data-f="parent" class="${inp}">${n.id==="c"?"<option value=''>—</option>":par}</select>
  ${L("Riesgo")}<select data-f="risk" class="${inp}">${rk}</select>
  ${L("Descripción breve")}${A("desc",n.desc)}
  ${prodBlock("bank","Banco",n.bank)}${prodBlock("fid","Fiduciaria",n.fid)}
  ${L("Evidencia")}${A("evid",n.evid)}${L("Señales de alerta")}${A("flags",n.flags)}
  ${L("Fuente")}${T("src",n.src)}${L("Fecha de actualización")}<input type="date" data-f="upd" value="${esc(n.upd)}" class="${inp}">
  ${n.id!=="c"?`<button id="del" class="mt-4 w-full bg-red-600 hover:bg-red-500 rounded py-2">Eliminar persona</button>`:""}`;
}
side.addEventListener("change",e=>{
  const n=byId(nodes,sel);if(!n)return;const t=e.target;
  if(t.dataset.f){const [a,b]=t.dataset.f.split(".");
    if(b){n[a]=n[a]||{cliente:false,productos:[]};n[a][b]=t.value==="true"}else n[a]=t.value;
    if(a==="name"||a==="photo")n.upd=n.upd; save();map.draw();if(a==="photo"||a==="name")panel()}
  if(t.dataset.p){const[k,i,f]=t.dataset.p.split(":");n[k].productos[+i][f]=t.value;save()}
});
side.addEventListener("click",e=>{
  const n=byId(nodes,sel),t=e.target;if(!n)return;
  if(t.dataset.ap){n[t.dataset.ap]=n[t.dataset.ap]||{cliente:true,productos:[]};n[t.dataset.ap].productos.push({tipo:"",numero:""});save();panel()}
  if(t.dataset.rm){const[k,i]=t.dataset.rm.split(":");n[k].productos.splice(+i,1);save();panel()}
  if(t.id==="del"&&confirm("¿Eliminar a "+n.name+" y sus dependientes?")){
    const rm=new Set([n.id]);let ch=true;while(ch){ch=false;nodes.forEach(m=>{if(!rm.has(m.id)&&rm.has(m.parent)){rm.add(m.id);ch=true}})}
    nodes=nodes.filter(m=>!rm.has(m.id));sel=null;save();map.draw();panel()}
});
</script></body></html>
